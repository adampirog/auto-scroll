[project]
name = "auto-scroll-android"
version = "0.1.0"
description = "Android accessibility integration for AutoScroll"
requires-python = ">=3.13"
dependencies = ["flet>=1.0,<2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "auto_scroll_android*",
    "flutter.auto_scroll_android*",
]
namespaces = true

[tool.setuptools.package-data]
"flutter.auto_scroll_android" = [
    "pubspec.yaml",
    "lib/**",
    "android/**",
]
